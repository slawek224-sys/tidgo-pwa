<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1E40AF" />
    <meta name="description" content="Contact TidGo support with questions about your account, subscription, receipt records or using the TidGo app." />
    <meta name="robots" content="index,follow" />
    <link rel="canonical" href="https://tidgo.co.uk/contact/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TidGo" />
    <meta property="og:title" content="Contact TidGo Support" />
    <meta property="og:description" content="Need help or have a question? Contact TidGo support." />
    <meta property="og:url" content="https://tidgo.co.uk/contact/" />
    <title>Contact TidGo Support</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="app">
      <main class="seo-fallback">
        <a class="seo-brand" href="/"><img src="/icon-192.png" alt="" /><span>TidGo</span></a>
        <section class="seo-card">
          <p class="eyebrow">Contact</p>
          <h1>Need help or have a question?</h1>
          <p>Contact TidGo about your account, subscription, receipt records or using the app.</p>
          <p>Email: <a href="mailto:support@tidgo.co.uk">support@tidgo.co.uk</a></p>
          <p>We reply as soon as we can with a straightforward, human answer.</p>
          <nav class="seo-links" aria-label="TidGo links">
            <a href="/">Homepage</a>
            <a href="/app/">Open app</a>
            <a href="/privacy/">Privacy Policy</a>
            <a href="/terms/">Terms</a>
          </nav>
        </section>
      </main>
    </div>
    <input id="expensePhotoPicker" class="hidden" type="file" accept="image/*" capture="environment" />
    <input id="expenseFilePicker" class="hidden" type="file" accept="image/*,.pdf" />
    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
    <script type="module" src="/app.js"></script>
  </body>
</html>
